<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem; }
        
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 0.5rem; }

        /* 칸반 보드 레이아웃 */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }

        .kanban-column {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #334155;
        }

        .column-title { font-size: 1.2rem; font-weight: bold; }
        .badge { background: #334155; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }

        /* 칸반 카드 */
        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
        .card h3 { font-size: 1.05rem; margin-bottom: 0.4rem; color: #f1f5f9; }
        .card p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.8rem; }
        
        .btn {
            display: inline-block;
            background: #0284c7;
            color: #fff;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #0369a1; }

        /* 모달(팝업) 창 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #475569;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
        pre { background: #0f172a; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <h1>📋</h1>
        <p> </p>
    </header>

    <div class="kanban-board">
        
        <!-- 1. HTML 게임 컬럼 -->
        <div class="kanban-column">
            <div class="column-header">
                <span class="column-title">🎮 HTML Games</span>
                <span class="badge">2</span>
            </div>
            
            <div class="card">
                <h3>Galatic</h3>
                <p>client</p>
                <a href="games/game1/cht1.html" class="btn">▶</a>
            </div>

            <div class="card">
                <h3>업데이트중</h3>
                <p>업데이트중</p>
                <a href="games/game2/index.html" class="btn">▶ 게임 실행</a>
            </div>
        </div>

        <!-- 2. 추천 사이트 컬럼 -->
        <div class="kanban-column">
            <div class="column-header">
                <span class="column-title">🌐 Recommended Sites</span>
                <span class="badge">2</span>
            </div>

            <div class="card">
                <h3>GitHub Repository</h3>
                <p>이 웹사이트의 소스코드가 저장된 레포지토리</p>
                <a href="https://github.com" target="_blank" class="btn">🔗 방문하기</a>
            </div>

            <div class="card">
                <h3>개발 유틸리티 사이트</h3>
                <p>자주 사용하는 개발 도구 모음</p>
                <a href="https://google.com" target="_blank" class="btn">🔗 방문하기</a>
            </div>
        </div>

        <!-- 3. 스크립트 컬럼 -->
        <div class="kanban-column">
            <div class="column-header">
                <span class="column-title">📜 Useful Scripts</span>
                <span class="badge">2</span>
            </div>

            <div class="card">
                <h3>다크모드 토글 스크립트</h3>
                <p>웹사이트 테마를 전환하는 JS 코드</p>
                <button class="btn" onclick="openModal('script1')">📄 코드 보기</button>
            </div>

            <div class="card">
                <h3>자동 스크롤 스크립트</h3>
                <p>페이지 맨 위로 부드럽게 이동하는 코드</p>
                <button class="btn" onclick="openModal('script2')">📄 코드 보기</button>
            </div>
        </div>

    </div>

    <!-- 스크립트 모달 팝업 -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">스크립트 이름</h3>
                <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            </div>
            <pre><code id="modalCode"></code></pre>
        </div>
    </div>

    <script>
        // 스크립트 데이터 저장소
        const scripts = {
            script1: {
                title: "다크모드 토글 스크립트",
                code: `// Dark Mode Toggle
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
}`
            },
            script2: {
                title: "자동 스크롤 스크립트",
                code: `// Scroll To Top
function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}`
            }
        };

        function openModal(id) {
            const data = scripts[id];
            if (data) {
                document.getElementById('modalTitle').innerText = data.title;
                document.getElementById('modalCode').innerText = data.code;
                document.getElementById('modalOverlay').classList.add('active');
            }
        }

        function closeModalDirect() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModal(event) {
            if (event.target.id === 'modalOverlay') {
                closeModalDirect();
            }
        }
    </script>
</body>
</html>
